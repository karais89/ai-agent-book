<text x="390.0" y="357" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">S(2): 창고</text>
<text x="390.0" y="375" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">A(2): 북쪽</text>
<text x="390.0" y="393" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">R(3): 0</text>
<line x1="459.0" y1="373" x2="469.0" y2="373" stroke="#999999" stroke-width="2" marker-end="url(#ah-light)"/>
<rect x="467.0" y="340" width="134.0" height="70" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="534.0" y="357" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">S(3): 경비실</text>
<text x="534.0" y="375" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="11.5" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">A(3): 은검 제작</text>
<text x="534.0" y="393" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">R(4): +10</text>
<line x1="603.0" y1="373" x2="613.0" y2="373" stroke="#999999" stroke-width="2" marker-end="url(#ah-light)"/>
<rect x="611.0" y="340" width="134.0" height="70" rx="4" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
<text x="678.0" y="357" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="normal">S(4): 경비실</text>
<text x="678.0" y="375" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">A(4): 공격</text>
<text x="678.0" y="393" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">R(5): +50</text>
<text x="390" y="460" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="16" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">목표: 누적 보상 G = R(1) + γR(2) + γ²R(3) + ... 극대화(γ=0.99)</text>
