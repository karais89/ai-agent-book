<text x="246.0" y="375" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">A(1): 열쇠 집기</text>
<text x="246.0" y="393" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="14" fill="#333333" text-anchor="middle" dominant-baseline="central" font-weight="bold">R(2): +5</text>
