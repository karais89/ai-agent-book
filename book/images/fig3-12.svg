<text x="400" y="445" font-family="'Noto Sans KR', 'Noto Sans CJK KR', 'Apple SD Gothic Neo', Arial, sans-serif" font-size="15" fill="#666666" text-anchor="middle" dominant-baseline="central" font-weight="normal">요인 중요도에 따라 질문 안내 → 유사 사건 원형 검색 → 데이터 기반 양형 분석</text>
