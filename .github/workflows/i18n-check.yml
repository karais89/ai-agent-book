name: Korean-English consistency check

# 한국어 기본판과 영어판의 문서 구조가 어긋나지 않도록 검사한다.
# 자세한 규칙은 scripts/check_i18n_consistency.py에 있다.

on:
  pull_request:
    paths:
      - "README.md"
      - "index.md"
      - "mkdocs.yml"
      - "build_epub.sh"
      - "book/**"
      - "book-en/**"
      - "docs/**"
      - "course/**"
      - "chapter*/README*.md"
      - "scripts/build_site.sh"
      - "scripts/seo_meta.py"
      - "scripts/source_links.py"
      - "extras/lang-switcher.js"
      - "extras/nav-collapse.js"
      - "extras/course/**"
      - "extras/agent-lab/**"
      - "overrides/**"
      - "scripts/check_i18n_consistency.py"
      - "scripts/check_korean_translation.py"
      - "scripts/check_course.py"
      - ".github/workflows/i18n-check.yml"
  push:
    branches: [main]
    paths:
      - "README.md"
      - "index.md"
      - "mkdocs.yml"
      - "build_epub.sh"
      - "book/**"
      - "book-en/**"
      - "docs/**"
      - "course/**"
      - "chapter*/README*.md"
      - "scripts/build_site.sh"
      - "scripts/seo_meta.py"
      - "scripts/source_links.py"
      - "extras/lang-switcher.js"
      - "extras/nav-collapse.js"
      - "extras/course/**"
      - "extras/agent-lab/**"
      - "overrides/**"
      - "scripts/check_i18n_consistency.py"
      - "scripts/check_korean_translation.py"
      - "scripts/check_course.py"
      - ".github/workflows/i18n-check.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run i18n consistency check
        run: |
          python scripts/check_i18n_consistency.py
          python scripts/check_korean_translation.py
          python scripts/check_course.py
