name: Build latest book artifacts

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "book-en/**"
      - "build_epub.sh"
      - "epub.css"
      - "flatten_epub_toc.py"
      - ".github/workflows/build-latest.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Restore TeX Live cache
        id: texlive-cache
        uses: actions/cache@v4
        with:
          path: ~/texlive-cache/texlive.tar
          key: texlive-${{ runner.os }}-${{ runner.arch }}-mactex-nogui-v1

      - name: Install CLI tools and Korean fonts
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install pandoc poppler librsvg
          brew install --cask font-dejavu font-noto-sans-cjk-kr font-noto-serif-cjk-kr

      - name: Install MacTeX
        if: steps.texlive-cache.outputs.cache-hit != 'true'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install --cask mactex-no-gui
          mkdir -p ~/texlive-cache
          sudo tar -cf ~/texlive-cache/texlive.tar -C / usr/local/texlive Library/TeX
          sudo chown "$USER" ~/texlive-cache/texlive.tar

      - name: Restore MacTeX
        if: steps.texlive-cache.outputs.cache-hit == 'true'
        run: sudo tar -xf ~/texlive-cache/texlive.tar -C /

      - name: Configure TeX and fonts
        run: |
          echo "/Library/TeX/texbin" >> "$GITHUB_PATH"
          fc-cache -f

      - name: Build Korean and English PDFs
        env:
          PANGOCAIRO_BACKEND: fontconfig
        run: |
          set -u
          pids=""
          for dir in book book-en; do
            (cd "$dir" && bash build_pdf.sh) > "build_${dir}.log" 2>&1 &
            pids="$pids $!:$dir"
          done
          fail=0
          for pd in $pids; do
            pid="${pd%%:*}"
            dir="${pd##*:}"
            if wait "$pid"; then
              echo "OK: $dir"
            else
              echo "::error::PDF build failed for $dir"
              fail=1
            fi
          done
          for dir in book book-en; do
            echo "===================== $dir ====================="
            cat "build_${dir}.log" 2>/dev/null || true
          done
          exit $fail

      - name: Build EPUBs
        run: ./build_epub.sh all

      - name: Upload to the rolling latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          out="$(mktemp -d)"
          cp book/AI-Agents-in-Depth-ko.pdf "$out/AI-Agents-in-Depth-ko.pdf"
          cp book/AI-Agents-in-Depth-ko.epub "$out/AI-Agents-in-Depth-ko.epub"
          cp book-en/AI-Agents-in-Depth-Bojie-Li-v1.3.pdf "$out/AI-Agents-in-Depth-en.pdf"
          cp book-en/AI-Agents-in-Depth-Bojie-Li-v1.3.epub "$out/AI-Agents-in-Depth-en.epub"
          if ! gh release view latest --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create latest --prerelease \
              --title "Latest book build" \
              --notes "Automatically updated Korean and English book artifacts." \
              --repo "${{ github.repository }}"
          fi
          gh release upload latest "$out"/* --clobber --repo "${{ github.repository }}"
